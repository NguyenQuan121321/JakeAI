[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jakeai-backend"
version = "0.1.0"
description = "Enterprise Embedded AI Platform integrating with FinnApiGo"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "JakeAI Architecture Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "pyjwt[crypto]>=2.10.0",
    "cryptography>=44.0.0",
    "redis[hiredis]>=5.2.1",
    "qdrant-client>=1.12.1",
    "httpx>=0.28.1",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "bandit>=1.8.2",
    "pip-audit>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "unit: Pure in-memory unit tests (fast, isolated, zero external services)",
    "integration: Integration tests (component and ASGI HTTP with local services)",
    "contract: API contract, schema drift, and protocol consistency tests",
    "security: Security, guardrails, BYOK, auth, and tenant isolation tests",
    "ai: AI quality, evaluation benchmarks, RAG grounding, and canary tests",
    "e2e: End-to-end multi-tier pipeline and platform workflow tests",
    "performance: Token, throughput, and latency performance benchmarks",
    "slow: Tests with execution duration exceeding 2.0 seconds",
    "critical_e2e: Critical end-to-end business workflows executed in PR gate",
    "live_external: Workflows requiring live external third-party API credentials",
    "evals: Backward-compatible alias for AI evaluation tests",
    "flaky_retry: Tests permitted a single controlled retry attempt under strict tracking",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B104", "B105", "B324"]

