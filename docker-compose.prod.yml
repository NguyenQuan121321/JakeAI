# Production Docker Compose Configuration for JakeAI Platform
# Configured memory limits total 3,672 MB, including the dedicated BYOK vault.
# Actual host sizing and workload qualification remain required.
# Invariant 4: Backend port 8000 and datastores are strictly isolated to Docker internal network

services:
  caddy:
    image: caddy:2-alpine
    container_name: jakeai-caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      jakeai-backend:
        condition: service_healthy
    networks:
      - jakeai-prod-network

  jakeai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jakeai-backend-prod
    restart: always
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PROJECT_NAME=JakeAI
      - API_V1_STR=/api/v1
      - CORS_ORIGINS=["https://jakeai.local","https://jakeai.yourdomain.com"]
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:?Provision independent internal secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Provision signing secret}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_ALGORITHM=HS256
      - JWT_KEY_ID=${JWT_KEY_ID:?Provision explicit Finn signing key ID}
      - JWT_PREVIOUS_KEY_ID=${JWT_PREVIOUS_KEY_ID:-}
      - JWT_PREVIOUS_LAST_ISSUED_AT=${JWT_PREVIOUS_LAST_ISSUED_AT:-}
      - IDENTITY_STATE_URL=${IDENTITY_STATE_URL:?Provision verified HTTPS Finn introspection}
      - IDENTITY_STATE_KEY_ID=${IDENTITY_STATE_KEY_ID:?Provision state service key ID}
      - IDENTITY_STATE_SECRET=${IDENTITY_STATE_SECRET:?Provision independent state credential}
      - IDENTITY_STATE_CA_FILE=${IDENTITY_STATE_CA_FILE:-}
      - FINNAPIGO_SERVICE_SECRET=${FINNAPIGO_SERVICE_SECRET:?Provision independent service secret}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?Provision independent audit secret}
      - BYOK_MASTER_KEY=${BYOK_MASTER_KEY:?Provision base64 AES-256 master}
      - BYOK_MASTER_KEY_ID=${BYOK_MASTER_KEY_ID:?Provision current master ID}
      - BYOK_PREVIOUS_KEYS=${BYOK_PREVIOUS_KEYS:-{}}
      - BYOK_RETIRED_KEY_IDS=${BYOK_RETIRED_KEY_IDS:-[]}
      - BYOK_RETIRED_KEY_HASHES=${BYOK_RETIRED_KEY_HASHES:-[]}
      - BYOK_STORAGE_BACKEND=redis
      - BYOK_REDIS_URL=redis://byok-redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      byok-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1200M
        reservations:
          memory: 800M
    networks:
      - jakeai-prod-network

  jakeai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jakeai-worker-prod
    restart: always
    command: python -m app.worker
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PROJECT_NAME=JakeAI-Worker
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:?Provision independent internal secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Provision signing secret}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_ALGORITHM=HS256
      - JWT_KEY_ID=${JWT_KEY_ID:?Provision explicit Finn signing key ID}
      - JWT_PREVIOUS_KEY_ID=${JWT_PREVIOUS_KEY_ID:-}
      - JWT_PREVIOUS_LAST_ISSUED_AT=${JWT_PREVIOUS_LAST_ISSUED_AT:-}
      - IDENTITY_STATE_URL=${IDENTITY_STATE_URL:?Provision verified HTTPS Finn introspection}
      - IDENTITY_STATE_KEY_ID=${IDENTITY_STATE_KEY_ID:?Provision state service key ID}
      - IDENTITY_STATE_SECRET=${IDENTITY_STATE_SECRET:?Provision independent state credential}
      - IDENTITY_STATE_CA_FILE=${IDENTITY_STATE_CA_FILE:-}
      - FINNAPIGO_SERVICE_SECRET=${FINNAPIGO_SERVICE_SECRET:?Provision independent service secret}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?Provision independent audit secret}
      - BYOK_MASTER_KEY=${BYOK_MASTER_KEY:?Provision base64 AES-256 master}
      - BYOK_MASTER_KEY_ID=${BYOK_MASTER_KEY_ID:?Provision current master ID}
      - BYOK_PREVIOUS_KEYS=${BYOK_PREVIOUS_KEYS:-{}}
      - BYOK_RETIRED_KEY_IDS=${BYOK_RETIRED_KEY_IDS:-[]}
      - BYOK_RETIRED_KEY_HASHES=${BYOK_RETIRED_KEY_HASHES:-[]}
      - BYOK_STORAGE_BACKEND=redis
      - BYOK_REDIS_URL=redis://byok-redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      byok-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 400M
    networks:
      - jakeai-prod-network

  # Credentials must not share the evictable cache Redis below.
  byok-redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --appendfsync always --maxmemory 128mb --maxmemory-policy noeviction
    expose:
      - "6379"
    volumes:
      - byok_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - jakeai-prod-network

  redis:
    image: redis:7-alpine
    container_name: jakeai-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - jakeai-prod-network

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: jakeai-qdrant-prod
    restart: always
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_prod_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1000M
        reservations:
          memory: 500M
    networks:
      - jakeai-prod-network

volumes:
  byok_data:
    driver: local
  redis_prod_data:
    driver: local
  qdrant_prod_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  jakeai-prod-network:
    driver: bridge
