services:
  jakeai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jakeai-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - PROJECT_NAME=JakeAI
      - API_V1_STR=/api/v1
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:8000"]
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - FINNAPIGO_JWKS_URL=http://host.docker.internal:8080/.well-known/jwks.json
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1200M
    restart: unless-stopped
    networks:
      - jakeai-network

  jakeai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jakeai-worker
    command: python -m app.worker
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - PROJECT_NAME=JakeAI-Worker
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks:
      - jakeai-network

  redis:
    image: redis:7-alpine
    container_name: jakeai-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - jakeai-network

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: jakeai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - jakeai-network

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  jakeai-network:
    driver: bridge
