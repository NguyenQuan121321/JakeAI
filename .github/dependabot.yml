version: 2
updates:
  # ============================================================================
  # Backend Python Packages (pip & pyproject.toml)
  # ============================================================================
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    groups:
      core-framework:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "starlette*"
      pydantic:
        patterns:
          - "pydantic*"
      ai-orchestration:
        patterns:
          - "langchain*"
          - "langgraph*"
      storage-and-vector:
        patterns:
          - "redis*"
          - "qdrant-client*"
          - "fastembed*"
          - "pypdf*"
      security-and-auth:
        patterns:
          - "pyjwt*"
          - "cryptography*"
      http-client:
        patterns:
          - "httpx*"
          - "httpcore*"
      tokenization:
        patterns:
          - "tiktoken*"
      test-and-dev-tooling:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
          - "bandit*"
          - "pip-audit*"
          - "pip-licenses*"

  # ============================================================================
  # Frontend TypeScript Packages (npm & package.json)
  # ============================================================================
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # ============================================================================
  # GitHub Actions Workflows
  # ============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci-cd"
    groups:
      actions-dependencies:
        patterns:
          - "*"
