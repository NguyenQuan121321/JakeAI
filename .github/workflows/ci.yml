name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scanning:
    name: DevSecOps - Secret & Key Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Complete Repository History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-and-sast:
    name: DevSecOps - Vulnerability Audit, SAST & License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Pip-Audit Dependency Vulnerability Scan
        run: |
          cd backend
          pip-audit -r requirements.txt

      - name: Bandit Static Application Security Testing (SAST)
        run: |
          cd backend
          bandit -c pyproject.toml -r app/

      - name: Pip-Licenses License Compliance Gate (Reject Copyleft)
        run: |
          cd backend
          pip-licenses --fail-on "GPL;AGPL;LGPL" --summary

      - name: Generate CycloneDX SBOM (Backend)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: "cyclonedx-json"
          output-file: "sbom-backend.cyclonedx.json"

      - name: Upload SBOM Compliance Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: sbom-backend.cyclonedx.json
          retention-days: 30

  infra-lint:
    name: Infrastructure & Workflow Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yaml

      - name: Actionlint GitHub Workflows Linter
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  lint-and-typecheck:
    name: Code Quality & Type Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Linter Check
        run: |
          ruff check backend/

      - name: Ruff Formatter Check
        run: |
          ruff format --check backend/

      - name: Mypy Static Type Checking
        run: |
          mypy --config-file backend/mypy.ini backend/app

  frontend-build-and-test:
    name: Frontend Widget Build & Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Static Type Checking
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest Unit Tests & Coverage Gate
        run: |
          cd frontend
          npm run test:coverage

      - name: Build Production Widget Bundles
        run: |
          cd frontend
          npm run build

      - name: Publish & Archive Frontend Widget Distribution
        uses: actions/upload-artifact@v7
        with:
          name: frontend-widget-dist
          path: frontend/dist/
          retention-days: 14

  unit-and-ai-tests:
    name: Automated Tests & AI RAG Regression
    runs-on: ubuntu-latest
    needs: [dependency-and-sast, infra-lint, lint-and-typecheck]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      FINNAPIGO_SECRET_KEY: ${{ secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_JWT_SECRET: ${{ secrets.FINNAPIGO_JWT_SECRET || secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY || '' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Unit & Integration Tests with Strict Coverage Floor (85%)
        run: |
          cd backend
          pytest --cov=app tests/ -v --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=85

      - name: Generate Coverage Report into GitHub Step Summary
        if: always()
        run: |
          cd backend
          python -c "
          import xml.etree.ElementTree as ET
          import os
          try:
              if os.path.exists('coverage.xml'):
                  tree = ET.parse('coverage.xml')
                  root = tree.getroot()
                  rate = float(root.attrib.get('line-rate', 0)) * 100
                  summary = f'### 📊 Backend Test Coverage: **{rate:.2f}%** (Quality Gate: ≥85%)\n\n'
                  summary += '| Component / Package | Coverage |\n| :--- | :--- |\n'
                  for pkg in root.findall('.//package'):
                      pname = pkg.attrib.get('name')
                      prate = float(pkg.attrib.get('line-rate', 0)) * 100
                      summary += f'| `{pname}` | {prate:.2f}% |\n'
                  summary += '\n*Quality Gate: ≥85% strictly enforced.*\n'
                  step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  if step_summary:
                      with open(step_summary, 'a', encoding='utf-8') as f:
                          f.write(summary)
          except Exception as e:
              print(f'Error writing summary: {e}')
          "

      - name: RAG Quality Gate & Anti-Hallucination Regression (Block 5)
        run: |
          cd backend
          pytest tests/evals/test_rag_regression.py -v

      - name: API Contract & Backward Compatibility Verification
        run: |
          cd backend
          pytest tests/contract/test_api_contract.py -v

      - name: Verify OpenAPI Schema Export & Drift Prevention
        run: |
          cd backend
          python -m app.main --export-openapi openapi.json
          git diff --exit-code openapi.json

      - name: Publish OpenAPI Specification Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: openapi-specification
          path: backend/openapi.json
          retention-days: 14

  container-build-and-scan:
    name: Container Packaging & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-and-sast, infra-lint, unit-and-ai-tests, frontend-build-and-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Dockerfile Build Integrity
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: jakeai-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Container Image Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jakeai-backend:test
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
