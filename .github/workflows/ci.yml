name: Continuous Integration

on:
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
      - "release/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Linter Check
        run: |
          ruff check backend/

      - name: Ruff Formatter Check
        run: |
          ruff format --check backend/

      - name: Mypy Static Type Checking
        run: |
          mypy --config-file backend/mypy.ini backend/app

  test-and-coverage:
    name: Automated Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with Coverage
        run: |
          cd backend
          pytest --cov=app tests/ -v --cov-report=xml --cov-report=term-missing

      - name: Verify OpenAPI Schema Export
        run: |
          cd backend
          python -m app.main --export-openapi openapi.json
          test -s openapi.json
