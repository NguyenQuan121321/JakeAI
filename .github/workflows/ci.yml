name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. DevSecOps Secret Scanning
  secret-scanning:
    name: DevSecOps - Secret & Key Leak Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Complete Repository History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  # 2. Static Analysis, Linters, SAST & License Compliance
  static-and-quality:
    name: Code Quality, SAST & License Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yaml

      - name: Actionlint GitHub Workflows Linter
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Lint & Security Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Linter Check
        run: |
          ruff check backend/

      - name: Ruff Formatter Check
        run: |
          ruff format --check backend/

      - name: Pip-Audit Dependency Vulnerability Scan
        run: |
          cd backend
          pip-audit -r requirements.txt

      - name: Bandit Static Application Security Testing (SAST)
        run: |
          cd backend
          bandit -c pyproject.toml -r app/

      - name: Pip-Licenses License Compliance Gate (Reject Copyleft)
        run: |
          cd backend
          pip-licenses --fail-on "GPL;AGPL;LGPL" --summary

      - name: Generate CycloneDX SBOM (Backend)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: "cyclonedx-json"
          output-file: "sbom-backend.cyclonedx.json"

      - name: Upload SBOM Compliance Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: sbom-backend.cyclonedx.json
          retention-days: 30

  # 3. Static Type Analysis
  typecheck-backend:
    name: Backend Type Analysis (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Mypy Static Type Checking
        run: |
          mypy --config-file backend/mypy.ini backend/app

  # 4. Frontend Quality & Bundle Build
  frontend-quality:
    name: Frontend Widget Build & Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Static Type Checking
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest Unit Tests & Coverage Gate
        run: |
          cd frontend
          npm run test:coverage

      - name: Build Production Widget Bundles
        run: |
          cd frontend
          npm run build

      - name: Publish & Archive Frontend Widget Distribution
        uses: actions/upload-artifact@v7
        with:
          name: frontend-widget-dist
          path: frontend/dist/
          retention-days: 14

  # 5. Fast In-Memory Unit Test Suite (Zero External Services, Zero Race Conditions)
  unit-tests:
    name: Unit Test Suite (In-Memory Isolation)
    runs-on: ubuntu-latest
    needs: [static-and-quality, typecheck-backend]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Unit Tests with Flaky Test Tracker
        run: |
          cd backend
          python scripts/ci_flaky_tracker.py --output-dir reports/flaky-unit -- tests/unit/ -v --junitxml=reports/junit/unit-results-${{ matrix.python-version }}.xml

      - name: Archive Unit Test Results
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            backend/reports/junit/unit-results-*.xml
            backend/reports/flaky-unit/
          retention-days: 14

  # 6. Contract & Runtime Security Suite
  contract-and-security:
    name: Contract, Schema Drift & Runtime Security Gate
    runs-on: ubuntu-latest
    needs: [static-and-quality, typecheck-backend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || secrets.FINNAPIGO_JWT_SECRET || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_SECRET_KEY: ${{ secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_JWT_SECRET: ${{ secrets.FINNAPIGO_JWT_SECRET || secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Internal Mutual Auth Contract Gate (Invariant 4)
        run: |
          cd backend
          pytest tests/contract/test_internal_mutual_auth.py -v

      - name: Dedicated Runtime Security Regression Suite (TEST-05 / SEC-001..SEC-010)
        run: |
          cd backend
          pytest tests/security/ -v --junitxml=reports/junit/security-results.xml

      - name: API Breaking Change & Schema Drift Gate (OpenAPI Contract Verification)
        run: |
          cd backend
          pytest tests/contract/test_api_contract.py -v --junitxml=reports/junit/contract-results.xml
          python -m app.main --export-openapi openapi.json
          git diff --exit-code openapi.json
          python scripts/check_openapi_breaking_changes.py

      - name: Publish OpenAPI Specification Artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-specification
          path: backend/openapi.json
          retention-days: 14

      - name: Archive Contract & Security Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-and-security-results
          path: backend/reports/junit/
          retention-days: 14

  # 7. Isolated Integration Tests (PR: Critical / Main: Full)
  integration-tests:
    name: Subsystem Integration Gate (Isolated Services)
    runs-on: ubuntu-latest
    needs: [static-and-quality, typecheck-backend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || secrets.FINNAPIGO_JWT_SECRET || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_SECRET_KEY: ${{ secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_JWT_SECRET: ${{ secrets.FINNAPIGO_JWT_SECRET || secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Subsystem Integration Test Suite (Full Parity Gate)
        run: |
          cd backend
          pytest -m integration -v --junitxml=reports/junit/integration-results.xml

      - name: Archive Integration Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: backend/reports/junit/integration-results.xml
          retention-days: 14

  # 8. AI RAG & Evaluation Gate (PR: Critical / Main: Full)
  ai-and-evals:
    name: AI Quality, RAG & Evaluation Gate
    runs-on: ubuntu-latest
    needs: [static-and-quality, typecheck-backend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || secrets.FINNAPIGO_JWT_SECRET || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_SECRET_KEY: ${{ secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_JWT_SECRET: ${{ secrets.FINNAPIGO_JWT_SECRET || secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: RAG Quality Gate & Anti-Hallucination Regression (Block 5)
        run: |
          cd backend
          pytest tests/evals/test_rag_regression.py -v

      - name: LLMOps Safety & Canary Data Leakage Gate (WORK-04)
        run: |
          cd backend
          pytest tests/evals/test_canary_leakage.py tests/evals/test_rag_metrics.py tests/evals/test_llm_judge_and_generation.py tests/evals/test_baseline_and_regression_gate.py -v

      - name: AI Behavior, Agent, RAG & Hallucination Evaluation Gate (TEST-06 / AI-012..AI-014)
        run: |
          cd backend
          pytest tests/evals/test_eval_agent_automation.py tests/evals/test_eval_rag_automation.py tests/evals/test_eval_hallucination_automation.py -v --junitxml=reports/junit/ai-results.xml

      - name: Phase 00 AI Evaluation Benchmark Gate (Full Parity Verification)
        run: |
          cd backend
          python scripts/run_ai_evaluation.py --output-dir benchmark-results
          pytest tests/evals/test_portfolio_benchmark.py -v -s

      - name: Archive AI Evaluation Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-evaluation-benchmark-results
          path: |
            backend/benchmark-results/
            backend/reports/junit/ai-results.xml
          retention-days: 30

  # 9. End-to-End Workflow & Bruno CLI Automation Gate
  e2e-and-bruno:
    name: E2E Business Workflows & Bruno CLI Automation
    runs-on: ubuntu-latest
    needs: [static-and-quality, typecheck-backend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || secrets.FINNAPIGO_JWT_SECRET || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_SECRET_KEY: ${{ secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_JWT_SECRET: ${{ secrets.FINNAPIGO_JWT_SECRET || secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Full End-to-End Business Workflows (TEST-07)
        run: |
          cd backend
          pytest tests/e2e/ -v -m "not live_external" --junitxml=reports/junit/e2e-results.xml

      - name: Full Bruno API & E2E Test Suite (TEST-08)
        run: |
          python scripts/run_bruno_tests.py --suite full --auto-start

      - name: Archive Bruno & E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-and-e2e-reports
          path: |
            backend/reports/bruno/
            backend/reports/junit/e2e-results.xml
          retention-days: 14

  # 10. Performance Regression & Dependency Validation Gate
  perf-and-dependency-gate:
    name: Performance Smoke & Dependency Regression Gate
    runs-on: ubuntu-latest
    needs: [static-and-quality, typecheck-backend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || secrets.FINNAPIGO_JWT_SECRET || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_SECRET_KEY: ${{ secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_JWT_SECRET: ${{ secrets.FINNAPIGO_JWT_SECRET || secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Performance Regression Smoke Gate (TEST-09 / PERF-003)
        env:
          QDRANT_OFFLINE: "1"
        run: |
          cd backend
          python scripts/run_performance_benchmark.py --mode smoke --fail-on-regression
          pytest tests/performance/test_performance_smoke.py tests/performance/test_performance_regression_gate.py tests/performance/test_performance_exceptions.py -v

      - name: Concurrency Stability Verification (Full Parity / PERF-004)
        run: |
          cd backend
          pytest tests/performance/test_load_and_concurrency.py -v

      - name: Dependency Regression Audit & Validation Gate (TEST-10)
        run: |
          cd backend
          python scripts/run_dependency_regression.py --mode audit
          python scripts/run_dependency_regression.py --mode validate --dry-run --fail-on-breakage
          pytest tests/unit/test_dependency_categories.py tests/unit/test_dependency_breakage_classifier.py tests/unit/test_dependency_regression_runner.py -v

      - name: Archive Performance & Dependency Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-and-dependency-artifacts
          path: |
            backend/benchmark-results/
            backend/reports/dependencies/
          retention-days: 14

  # 11. Consolidated Coverage Enforcement, Forensic Failure Summary & Flaky Audit
  coverage-and-reporting:
    name: Coverage Gate, Forensic Failure Reporting & Flaky Audit
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - contract-and-security
      - integration-tests
      - ai-and-evals
      - e2e-and-bruno
      - perf-and-dependency-gate
    if: always()
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || secrets.FINNAPIGO_JWT_SECRET || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_SECRET_KEY: ${{ secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}
      FINNAPIGO_JWT_SECRET: ${{ secrets.FINNAPIGO_JWT_SECRET || secrets.FINNAPIGO_SECRET_KEY || 'test-key-for-ci-pipeline-min-32-chars-long' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Strict Test Coverage Floor (>= 85% Branch Coverage Enforcement)
        run: |
          cd backend
          pytest --cov=app --cov-branch tests/ -v --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=85

      - name: Strict Coverage Gate & Patch Coverage Diff Analysis (>= 85% Line, >= 80% Patch)
        run: |
          cd backend
          python scripts/check_coverage_diff.py --min-line 85 --min-patch 80

      - name: Strict Flaky Test Verification Gate
        run: |
          cd backend
          python scripts/ci_flaky_tracker.py --check-ledger reports/flaky-unit/flaky-tests.json --fail-on-flaky

      - name: Generate Consolidated CI Failure & Forensic Step Summary (TEST-11)
        if: always()
        run: |
          python scripts/ci_failure_reporter.py --report-dirs backend/reports backend/benchmark-results --output-dir backend/reports/summary --fail-on-flaky

      - name: Archive Coverage & Forensic Summary Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-and-coverage-summary
          path: |
            backend/coverage.xml
            backend/reports/summary/
          retention-days: 30

  # 12. Final Container Packaging & Trivy Vulnerability Scan
  container-build-and-scan:
    name: Container Packaging & Vulnerability Scan
    runs-on: ubuntu-latest
    needs:
      - secret-scanning
      - static-and-quality
      - typecheck-backend
      - frontend-quality
      - coverage-and-reporting
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Dockerfile Build Integrity
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: jakeai-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Container Image Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jakeai-backend:test
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # 13. Canonical Aggregate Merge Gate (Principal Branch Protection Status Check)
  merge-gate:
    name: CI / Merge Gate
    runs-on: ubuntu-latest
    needs:
      - secret-scanning
      - static-and-quality
      - typecheck-backend
      - frontend-quality
      - unit-tests
      - contract-and-security
      - integration-tests
      - ai-and-evals
      - e2e-and-bruno
      - perf-and-dependency-gate
      - coverage-and-reporting
      - container-build-and-scan
    steps:
      - name: Validate All Upstream Gates Passed
        run: |
          echo "================================================================================"
          echo "CI / MERGE GATE: SUCCESS"
          echo "================================================================================"
          echo "All 12 upstream verification gates passed with zero regressions:"
          echo "  1. DevSecOps - Secret & Key Leak Detection"
          echo "  2. Code Quality, SAST & License Compliance Gate"
          echo "  3. Backend Type Analysis (Mypy)"
          echo "  4. Frontend Widget Build & Quality Verification"
          echo "  5. Unit Test Suite (In-Memory Isolation) [Python 3.11 & 3.12]"
          echo "  6. Contract, Schema Drift & Runtime Security Gate"
          echo "  7. Subsystem Integration Gate (Isolated Services)"
          echo "  8. AI Quality, RAG & Evaluation Gate"
          echo "  9. E2E Business Workflows & Bruno CLI Automation"
          echo "  10. Performance Smoke & Dependency Regression Gate"
          echo "  11. Coverage Gate, Forensic Failure Reporting & Flaky Audit"
          echo "  12. Container Packaging & Vulnerability Scan"
          echo "================================================================================"
          echo "Commit is certified safe for merge into main."
          echo "================================================================================"

