name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-gate:
    name: Validate CI Quality Gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Verify Gate Status
        run: |
          echo "CI Pipeline passed with green status. Proceeding to Continuous Deployment."

  semver-release:
    name: Automated SemVer Tag & GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-gate
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_tag }}
      release_tag: ${{ steps.tag_version.outputs.tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Generate SemVer Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          release_branches: main
          create_annotated_tag: true

      - name: Create GitHub Production Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-and-openapi-release:
    name: Package Frontend Widget & OpenAPI Release Assets
    runs-on: ubuntu-latest
    needs: [deploy-gate, semver-release]
    if: ${{ needs.semver-release.outputs.new_version != '' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Distribution Bundles
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Export Verified OpenAPI 3.1.0 Specification
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m app.main --export-openapi openapi.json

      - name: Attach Assets to GitHub Production Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semver-release.outputs.new_version }}
          files: |
            frontend/dist/jake-ai-widget.umd.js
            frontend/dist/jake-ai-widget.es.js
            frontend/dist/style.css
            backend/openapi.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Production Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-bundle
          path: |
            frontend/dist/
            backend/openapi.json
          retention-days: 90

  build-and-publish:
    name: Build & Publish Container (GHCR / Docker Hub)
    runs-on: ubuntu-latest
    needs: [deploy-gate, semver-release]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/backend
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/jakeai-backend', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=${{ needs.semver-release.outputs.new_version }},enable=${{ needs.semver-release.outputs.new_version != '' }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-cloud-deployment:
    name: Trigger Cloud Server Webhook Deployment
    runs-on: ubuntu-latest
    needs: [build-and-publish, frontend-and-openapi-release, semver-release]
    steps:
      - name: Invoke Deployment Webhook (Render / VPS / AWS / Railway)
        run: |
          if [ -z "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "DEPLOY_WEBHOOK_URL secret not configured. Skipping external webhook dispatch."
            exit 0
          fi

          echo "Dispatching deployment webhook with SemVer release ${{ needs.semver-release.outputs.new_version }}..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "tag": "${{ needs.semver-release.outputs.new_version }}",
              "commit": "${{ github.sha }}",
              "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
            }')

          echo "Webhook response status code: ${STATUS_CODE}"
          if [ "${STATUS_CODE}" -ge 200 ] && [ "${STATUS_CODE}" -lt 400 ]; then
            echo "Deployment webhook triggered successfully."
          else
            echo "Deployment webhook returned unexpected status ${STATUS_CODE}."
            exit 1
          fi
